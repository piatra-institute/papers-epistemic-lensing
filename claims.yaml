- id: friston-blanket
  kind: source
  passage: The architecture corresponds to the Markov-blanket formalism [@pearl1988; @friston2013].
  evidence:
    citation_id: friston2013
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1098/rsif.2013.0475; the abstract: a Markov blanket separates internal
      and external states in a statistical sense.'
- id: friston2017
  kind: source
  passage: 'In active inference, an agent is separated from its environment by a Markov blanket: sensory
    and active states that mediate all interaction between internal and external states [@friston2017].'
  evidence:
    citation_id: friston2017
    locator: Abstract
    verified: true
    verification_note: DOI 10.1162/neco_a_00912; the abstract presents active inference as a process theory;
      the Markov-blanket separation itself is stated in Friston 2013 (abstract checked).
- id: tversky
  kind: source
  passage: '*Examples*: sensationalist coverage of rare events, trending algorithms that promote high-engagement
    content regardless of base rate, exploitation of the availability heuristic [@tversky1974].'
  evidence:
    citation_id: tversky1974
    locator: Abstract
    verified: true
    verification_note: DOI 10.1126/science.185.4157.1124; the abstract names the availability heuristic
      among three heuristics that lead to systematic errors.
- id: lewandowsky
  kind: source
  passage: The empirical counterpart is the continued influence of misinformation after retraction [@lewandowsky2012]
    and the limited and variable effect of fact-checking [@walter2020].
  evidence:
    citation_id: lewandowsky2012
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1177/1529100612451018; the abstract explains why retractions are ineffective
      in memory updating. Walter et al. (10.1080/10584609.2019.1668894) abstract: a meta-analysis (k =
      30) finds a modest positive effect (d = 0.29) that weakens under several conditions, i.e. limited
      and variable.'
- id: def-lensing
  kind: definition
  passage: Epistemic lensing occurs when the mapping $W_t \to M_t \to q_i$ systematically deforms belief
    relative to the benchmark mapping $W_t \to X_t \to q^*$.
  rationale: Formal definition relative to a benchmark channel.
- id: def-loss
  kind: definition
  passage: 'Information loss measures how much world-relevant information survives mediation:'
  rationale: Metric definition.
- id: def-curvature
  kind: definition
  passage: 'Inferential curvature is the difference in update sensitivity between mediated and benchmark
    channels:'
  rationale: Metric definition.
- id: def-hysteresis
  kind: definition
  passage: 'Hysteresis is the residual divergence after correction:'
  rationale: Metric definition.
- id: def-shear
  kind: definition
  passage: When subpopulations are exposed to differently structured channels, their posteriors diverge
    systematically.
  rationale: Population-level definition of posterior shear follows.
- id: asm-blind
  kind: assumption
  passage: In keeping with Section 2.2, the agent does not observe the channel $\mathcal{C}$.
  rationale: The agent's fixed assumed noise is what makes dispersion change identically zero in three
    scenarios.
- id: asm-attenuation
  kind: assumption
  passage: 'Attenuation is modeled as reduced signal-to-noise: a parameter $\alpha \in (0,1]$ adds $(1/\alpha
    - 1)\,\sigma_X^2$ of variance, so the channel still tracks $X_t$ without directional bias and transmits
    less information.'
  rationale: Modelling choice that keeps attenuation free of directional bias.
- id: asm-benchmark
  kind: assumption
  passage: The benchmark $q^*$ is the posterior a well-calibrated agent would form from a *higher-fidelity*
    channel.
  rationale: Relative-fidelity benchmark; acknowledged as approximate in Section 8.
- id: int-zero
  kind: interpretation
  passage: 'The other three have a dispersion change of $0.00$, identically zero by construction: the
    agent updates on every step with a fixed assumed noise, so its posterior variance follows the same
    recursion as the benchmark''s.'
  rationale: Fixed assumed noise makes the posterior-variance recursion identical to the benchmark's.
- id: int-confident
  kind: interpretation
  passage: 'The decomposition carries the strongest evidence: three of the four channels displace the
    posterior without widening it, so the agent is confident and wrong at once.'
  rationale: Reading of the dispersion decomposition (A, C, D at 0.00).
- id: int-hyst
  kind: interpretation
  passage: In this single-agent model the post-reversal residual tracks each channel's steady-state distortion
    and does not isolate a memory-specific residue.
  rationale: Hysteresis values (0.22-0.35) track posterior divergence (0.22-0.36) scenario by scenario.
- id: int-curv-clean
